<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h1 class="text-center">Circus Ticket Reservation Form</h1>
    <form class="row">
        <label for="exampleInputEmail1" class="form-label ms-4">Name:</label>
        <div class=" col-6 mb-3">
            <input type="Name" class="form-control round-end-5 ms-4" placeholder="First" aria-describedby="NameHelp" >
        </div>
        <div class="col-6 mb-3">
            <input type="Name" class="form-control round-end-5 ms-4 me-5" placeholder="First" aria-describedby="NameHelp" >
        </div>
        <label for="exampleInputEmail1" class="form-label ms-4">Email:</label>
        <div class="col-12 mb-3">
            <input type="Name" class="form-control round-end-5 ms-4 me-5" placeholder="" aria-describedby="NameHelp" >
        </div>
        <label for="exampleInputEmail1" class="form-label ms-4">Phone:</label>
        <div class="col-12 mb-3">
            <input type="Name" class="form-control round-end-5 ms-4 me-5" placeholder="*** *** ****" aria-describedby="NameHelp" >
        </div>
        <label for="exampleInputEmail1" class="form-label ms-4">How many tickets do you want?</label>
        <div class="col-12 mb-3">
            <input type="Name" class="form-control round-end-5 ms-4 me-5" placeholder="*** *** ****" aria-describedby="NameHelp" >
        </div>  
        <div class="col-2 mb-3 ms-4">
            <input type="radio" name="tickets" value="1">  1 
        </div>
        <div class="col-2 mb-3">
            <input type="radio" name="tickets" value="2">  2
        </div>
        <div class="col-2 mb-3">
            <input type="radio" name="tickets" value="3">  3
        </div>
        <div class="mb-3 ms-4 col-6">
            <label for="exampleFormControlTextarea1" class="form-label">How many childrens are there?</label>
            <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
          </div>


    </form>
</body>
</html>
